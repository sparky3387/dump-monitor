# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

jobs:
  build:
    # PINNED, not `ubuntu-latest`. That label migrates to a newer Ubuntu on its
    # own schedule and would move LLVM out from under the toolchain step with
    # no commit here to explain it. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      # A shallow clone is enough: VERSION comes from the Makefile, not from
      # `git describe`, so there is nothing here that needs tags.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout pacbrew-repo
        uses: actions/checkout@v7
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: pacbrew-repo

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-18 \
            cmake \
            curl \
            libarchive-tools \
            lld-18 \
            makepkg \
            pacman-package-manager \
            pkg-config \
            python3

      # The SDK package only. The payload's C++ is structural -- an IPMI
      # EventHandler subclass -- and it is built -fno-exceptions -fno-rtti and
      # LINKED WITH $(CC) precisely so no C++ runtime is needed, so the
      # pacbrew libcxx package is not installed here. If a link ever asks for
      # -lc++ something has started pulling in the STL; fix that, do not add
      # the package to hide it.
      - name: Build the PS5 payload SDK
        working-directory: pacbrew-repo/sdk
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      # CASE 2 OF deploy.sh's RESOLVER, PROVED ON EVERY PUSH. It builds nothing
      # and needs no console; it only reports which toolchain it found. This
      # runner is the only place case 2 (a versioned LLVM 18 directory, which
      # is what apt gives you) is exercised at all -- the author's machine is
      # NixOS and always takes case 3. It runs BEFORE the PATH fix-up below, or
      # it would resolve case 1 and prove nothing.
      - name: Prove the toolchain resolver finds the versioned LLVM dir
        run: |
          set -eux
          out=$(./deploy.sh --print-toolchain)
          echo "$out"
          case "$out" in
            *"/usr/lib/llvm-18/bin (added to PATH)"*) ;;
            *) echo "resolver took an unexpected path on this runner" >&2; exit 1 ;;
          esac

      # THIS REPO DOES FIX UP PATH, unlike the sibling library whose build.sh
      # resolves the toolchain itself and is tested by NOT fixing it. Here the
      # build is plain `make`, and the SDK's prospero-* wrappers exec an
      # UNVERSIONED clang / ld.lld / llvm-config. apt installs those names only
      # under /usr/lib/llvm-18/bin, so without this the SDK wrapper fails as
      # `clang: No such file or directory` and nothing says why.
      - name: Put the unversioned LLVM 18 names on PATH
        run: |
          test -x /usr/lib/llvm-18/bin/clang
          test -x /usr/lib/llvm-18/bin/ld.lld
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      # A WRAPPED clang builds the SDK cleanly and kills the payload on
      # hardware, so this is checked here rather than trusted. libc's raw
      # syscall stubs end in a hand-written `ret` inside inline asm, which is
      # correct only while no frame-pointer prologue is emitted; a wrapper that
      # forces one on turns every stub into `push %rbp; mov %rsp,%rbp; ... ret`
      # and the `ret` pops the saved frame pointer instead of the return
      # address. The process then takes SIGSEGV on an instruction fetch before
      # it can log a thing.
      #
      # Must be 0. A poisoned build prints 233, one per stub. The member has to
      # be extracted to a file first -- objdump cannot read stdin, and piping
      # it in makes the grep count nothing and the check pass either way.
      - name: Verify the SDK's syscall stubs
        run: |
          set -eux
          ar p "$PS5_PAYLOAD_SDK/target/lib/libc.a" syscalls.o > stubs.o
          count=$(objdump -d stubs.o | grep -c 'push   %rbp' || true)
          rm -f stubs.o
          echo "frame-pointer prologues in libc's syscall stubs: $count"
          test "$count" = 0

      - name: Build
        run: |
          set -eux
          make
          mkdir -p out
          cp dump_monitor_v*.elf out/

      # DIAG=1 compiles the one-shot vm_map / module-base dump, which is behind
      # #ifdef and therefore rots unnoticed -- it is only ever built by hand,
      # when something is already going wrong. Building it on every push is how
      # it stays buildable for the session that needs it.
      - name: Build the DIAG variant
        run: |
          set -eux
          make clean
          make DIAG=1
          for f in dump_monitor_v*.elf; do
            cp "$f" "out/${f%.elf}-diag.elf"
          done
          ls -l out
          # AND PROVE THE SWITCH DID SOMETHING. The two ELFs being identical is
          # how this was caught: the Makefile defined -DCDM_DIAG for a month
          # after the source had been renamed to test DM_DIAG, so `make DIAG=1`
          # compiled the same binary and nothing said so. Building both is
          # worthless without comparing them.
          for d in out/*-diag.elf; do
            f="${d%-diag.elf}.elf"
            if cmp -s "$f" "$d"; then
              echo "DIAG=1 produced a byte-identical ELF -- the switch is dead" >&2
              exit 1
            fi
            echo "DIAG differs: $(stat -c%s "$f") vs $(stat -c%s "$d") bytes"
          done

      - name: Upload the payload
        uses: actions/upload-artifact@v7
        with:
          name: dump-monitor-${{ github.sha }}
          path: out/*.elf
          if-no-files-found: error

  # EVERY PUSH TO main GETS A DOWNLOADABLE BUILD, at one moving tag. The build
  # job's artifact is retrievable only with a GitHub login and expires; a
  # release asset is a plain URL that keeps working, which is what someone
  # testing a payload on a console actually needs.
  #
  # It is a PRERELEASE, deliberately. Nothing in CI can tell whether a payload
  # runs on hardware -- that takes a console, and `./deploy.sh --elf <file>`
  # against a downloaded asset is how it is checked. So this publishes
  # "built and self-checked", never "known good", and the notes say so.
  #
  # The tag is deleted and recreated rather than left behind, so `latest`
  # always means this commit and there is one rolling entry instead of a
  # release per push. Versioned releases are the `release` job below, on a real
  # tag, and those are immutable.
  rolling:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the built payload
        uses: actions/download-artifact@v8
        with:
          name: dump-monitor-${{ github.sha }}
          path: dist

      - name: Refresh the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          ls -l dist
          # `|| true`: there is nothing to delete on the first run, and a
          # missing release is not a failure here.
          gh release delete latest --repo "${{ github.repository }}" \
            --yes --cleanup-tag || true
          gh release create latest \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "latest build (${GITHUB_SHA:0:7})" \
            --prerelease \
            --notes "Automatic build of ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%dT%H:%MZ).

          Built and self-checked by CI: the SDK's syscall stubs are verified, and
          the DIAG variant is confirmed to differ from the plain one. **Not
          tested on a console** -- CI has no hardware. To test one:

          \`\`\`
          ./deploy.sh --elf dump_monitor_v1.0.elf --host <console>
          \`\`\`

          \`-diag\` adds the one-shot vm_map / module-base dump. For a release
          with a version behind it, use a tagged one." \
            dist/*.elf

  # ON A TAG ONLY. The build above runs on every push; this attaches ITS output
  # to a GitHub Release, so a release is always the artefact of a run that
  # passed the checks above rather than a second, separately-compiled one.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the built payload
        uses: actions/download-artifact@v8
        with:
          name: dump-monitor-${{ github.sha }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # gh is preinstalled on the runner, so this needs no third-party action
        # and has no Node runtime to be deprecated out from under it.
        run: |
          set -eux
          ls -l dist
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.elf
